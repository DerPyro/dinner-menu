<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Restaurant BreWo</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="hero">
      <div class="hero-content">
        <div class="restaurant-icon">🍽️</div>

        <h1 id="restaurant-name">Restaurant BreWo</h1>

        <p id="restaurant-subtitle">Unsere Abendkarte</p>
      </div>
    </header>

    <main class="container">
      <!-- ZUFALL -->

      <section class="random-section">
        <h2>Keine Ahnung?</h2>

        <p>Lass das Schicksal entscheiden.</p>

        <button id="random-button" class="random-button">
          🎲 Überrasch uns!
        </button>
      </section>

      <!-- TAGS -->

      <section class="filter-section">
        <h2>🏷️ Worauf habt ihr Lust?</h2>

        <div id="tag-filters" class="tag-filters"></div>
      </section>

      <!-- ZUTATEN -->

      <section class="ingredients-section">
        <h2>🥬 Was haben wir zuhause?</h2>

        <p class="section-description">
          Wähle alle Zutaten aus, die aktuell vorhanden sind.
        </p>

        <div id="ingredient-list" class="ingredient-list"></div>
      </section>

      <!-- VORSCHLÄGE -->

      <section class="suggestions-section">
        <h2>🍳 Was können wir kochen?</h2>

        <div id="suggestions" class="menu-list"></div>
      </section>

      <!-- SPEISEKARTE -->

      <section>
        <h2 class="menu-heading">📖 Unsere Speisekarte</h2>

        <div id="menu"></div>
      </section>
    </main>

    <!-- RANDOM MODAL -->

    <div id="random-modal" class="modal hidden">
      <div class="modal-backdrop"></div>

      <div class="modal-content">
        <div id="random-emoji" class="modal-emoji">🎲</div>

        <p class="modal-label">Heute gibt es...</p>

        <h2 id="random-name"></h2>

        <div id="random-tags" class="tags"></div>

        <div id="random-ingredients"></div>

        <div class="modal-actions">
          <button id="again-button">🎲 Nochmal</button>

          <button id="close-modal" class="primary-button">Klingt gut!</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
